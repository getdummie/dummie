<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dummie — the internet of individuals</title>
    <meta name="description" content="dummie — the internet of individuals." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      /* The website's tokens, trimmed to what one page uses and kept in the same
         oklch values so this page and the marketing site are the same green.
         Light only: there is nowhere here to store a choice, and this is the
         face of the fleet rather than a screen someone works in. */
      :root {
        color-scheme: light;
        --radius-sm: 0.125rem;
        --background: oklch(1 0 0);
        --foreground: oklch(0.17 0.008 220);
        --muted-foreground: oklch(0.46 0.01 215);
        --primary: oklch(0.8 0.15 162);
        --primary-text: oklch(0.52 0.12 162);
        --border: oklch(0.9 0.005 220);
        --ring: oklch(0.52 0.12 162);
        --font-sans: 'Archivo', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 3rem 1.25rem;
        background-color: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-feature-settings: 'ss01', 'cv01';
        -webkit-font-smoothing: antialiased;
      }

      /* The site's technical grid, masked so it fades out below the fold. */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.6;
        background-image:
          linear-gradient(to right, var(--border) 1px, transparent 1px),
          linear-gradient(to bottom, var(--border) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
      }

      main {
        position: relative;
        width: 100%;
        max-width: 40rem;
      }

      /* Uppercased in CSS so the accessible text stays sentence-case. */
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--primary-text);
      }
      .eyebrow span {
        display: inline-block;
        width: 0.375rem;
        height: 0.375rem;
        background-color: var(--primary);
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2.5rem;
      }

      /* Scoped to the button row: the credit below is a link in running text and
         should not become a fourth button. */
      .links a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem 1.125rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 0.875rem;
        text-decoration: none;
        color: var(--foreground);
        transition: border-color 150ms ease, color 150ms ease;
      }
      .links a:hover {
        border-color: var(--primary-text);
        color: var(--primary-text);
      }
      .links a.primary {
        border-color: var(--primary);
        background-color: var(--primary);
        color: oklch(0.18 0.02 200);
      }
      .links a.primary:hover {
        color: oklch(0.18 0.02 200);
        opacity: 0.9;
      }

      .credit {
        margin: 3rem 0 0;
        text-align: right;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      .credit a {
        color: var(--primary-text);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
        border-radius: var(--radius-sm);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><span aria-hidden="true"></span>dummie</p>
      <h1>the internet of individuals</h1>
      <div class="links">
        <a class="primary" href="{{CONTROL_URL}}">Create your own <span aria-hidden="true">-&gt;</span></a>
        <a href="https://www.dummie.dev">What is dummie?</a>
        <a href="https://github.com/getdummie/dummie" rel="noreferrer">GitHub</a>
      </div>
      <p class="credit">
        Crafted by
        <a href="https://codingcoffee.dev" target="_blank" rel="noopener noreferrer">Ameya Shenoy</a>
      </p>
    </main>
  </body>
</html>
