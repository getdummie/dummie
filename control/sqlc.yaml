version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        # Pin Go field names for columns whose default casing is awkward, so
        # they're deterministic regardless of sqlc's initialism handling.
        rename:
          ip: "IP"
          last_ip: "LastIP"
          os: "OS"
          os_version: "OSVersion"
          machine_id: "MachineID"
          vm_id: "VMID"
          vm_ip: "VMIP"
          vm_name: "VMName"
          host_vm_id: "HostVMID"
          cpus: "CPUs"
          memory_mib: "MemoryMiB"
          cpu_count: "CPUCount"
          cpu_percent: "CPUPercent"
          vcpu_limit: "VCPULimit"
          memory_limit_mib: "MemoryLimitMiB"
          disk_limit_mib: "DiskLimitMiB"
          disk_mib: "DiskMiB"
