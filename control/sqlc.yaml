version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        # Pin the Go field name for the `ip` column so it's deterministic
        # regardless of sqlc's initialism handling.
        rename:
          ip: "IP"
