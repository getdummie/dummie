<svg width="128" height="128" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Oxide green plate. Literal, not currentColor: this file is also the
       favicon, where there is no inherited colour to pick up. -->
  <rect width="100" height="100" rx="22" fill="#48D597"/>

  <!-- The mark, inset so the circle does not crowd the rounded corners. -->
  <g transform="translate(50 50) scale(0.86) translate(-50 -50)" stroke="#0B1A1E">
    <!-- Thicker outer circle -->
    <circle cx="50" cy="50" r="44" stroke-width="5"/>

    <!-- Squished, filled diamond moved slightly down -->
    <polygon points="50,27 72,39 50,51 28,39" fill="#0B1A1E" stroke="none"/>

    <!-- Internal structure lines -->
    <line x1="50" y1="27" x2="50" y2="51" stroke-width="1.5"/>
    <line x1="28" y1="39" x2="72" y2="39" stroke-width="1.5"/>
  </g>
</svg>
