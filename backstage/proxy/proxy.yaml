# Example proxy configuration. Paths are relative to the working directory.
control_socket: /run/dpipe/control.sock

http: # plaintext HTTP (proxy sniffs Host + hands off a copy)
  listen: ":8080"
  reuseport: true
  hosts:
    # A request is routed to host:default_port. A port absent from
    # unauthenticated_ports requires an authenticated user, so an empty or
    # omitted list protects every port.
    one.vm.local:
      host: 127.0.0.1
      unauthenticated_ports: [8001]
      default_port: 8001
    two.vm.local: # reachable only after authenticating
      host: 127.0.0.1
      unauthenticated_ports: []
      default_port: 8002
  default: "" # still host:port; empty => 502

# Required once any host protects a port. The control server signs login tokens
# with the same secret, so rotating it means restarting the proxy — not dpipe.
auth:
  control_url: "http://control.local/login"
  cookie_name: dpipe_session
  cookie_secret_file: /etc/dpipe/keys/cookie_secret # >= 32 bytes
  cookie_ttl: 12h
  cookie_secure: false # true once served over HTTPS
  # lax: the session cookie is only sent when the guest and the top-level page
  # are the same site, so a guest framed by a page on another domain looks
  # unauthenticated. none: it is sent from a frame too (and Partitioned, so the
  # framed session is keyed to the page framing it) — requires cookie_secure.
  cookie_samesite: lax

https: # TLS ingress (proxy accepts raw, dpipe terminates)
  listen: ":8443"
  reuseport: true
  # routing and the auth policy above reuse http.hosts via resolve{kind:"http"};
  # certs live in dpipe.tls
  # NOTE: dpipe.tls.enabled must be true for this ingress to work.

tcp:
  - listen: ":9000"
    target: "127.0.0.1:9000"
    protocol: tcp
    reuseport: true

ssh:
  listen: ":2222"
  reuseport: true
  users:
    - pubkey_file: ./keys/alice.pub
      target: "127.0.0.1:22"
      remote_user: "dev"
    # - pubkey: "ssh-ed25519 AAAA... bob@laptop"
    #   target: "127.0.0.1:2200"
    #   remote_user: "root"

listen_forwards:
  - listen: "127.0.0.1:15432"
    target: "127.0.0.1:5432"

dial_timeout: 5s
http_sniff_timeout: 5s
http_sniff_max_bytes: 65536
log_level: info
