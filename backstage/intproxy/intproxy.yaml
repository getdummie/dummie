# Example intproxy configuration. The real one is generated by the control
# server and written to /etc/dclient/intproxy.yaml by dclient.

# A concrete address, never a wildcard: dproxy holds 0.0.0.0:443 on the same
# host, and the two only coexist because this bind is more specific.
listen: "10.64.255.254:443"

# freebind lets the bind succeed before dclient has created the address, so the
# two services have no startup ordering between them.
freebind: true

# Both dproxy and intproxy set SO_REUSEPORT so the second bind is legal. They do
# not form a reuseport group -- that needs identical addresses -- so there is no
# load balancing between them.
reuseport: true

tld: "example.com"
label: "int"

console_url: "https://control.example.com"

tls:
  cert: /etc/intproxy/certs/fullchain.pem
  key: /etc/intproxy/certs/privkey.pem
  min_version: "1.2"

# Where a short-lived installation token comes from. dclient serves this socket
# in the host namespace and relays to the control server with the host's own
# credential, so intproxy holds no credential of its own.
broker:
  socket: /run/intproxy/broker.sock
  timeout: 5s
  # Renew this long before github's expiry.
  token_skew: 60s

github:
  git_host: github.com
  api_host: api.github.com

dial_timeout: 10s
tls_handshake_timeout: 10s

# A header deadline, not a body deadline. There is deliberately no read or write
# timeout: a packfile clone is one long request in each direction.
response_header_timeout: 60s

idle_timeout: 120s
read_header_timeout: 30s
shutdown_grace: 5m

log_level: info
