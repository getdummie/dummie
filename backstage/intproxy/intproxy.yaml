# Broker mode: this process holds no credential and no policy. It asks a unix
# socket on every uncached request, and whatever serves that socket decides.
# This is the shape the control server generates and dclient installs.

listen: "10.64.255.254:80"
tld: "dum.bureaucat.org"
label: "int"
docs_url: "http://console.bureaucat.org:1323/integrations"

tls:
  enabled: false

# A concrete address, never a wildcard: dproxy holds 0.0.0.0:443 on this host and
# the two only coexist because this bind is more specific. freebind lets it
# succeed before dclient has created the address.
freebind: true
reuseport: true

credential:
  mode: broker
  token_skew: 60s
  # Bounds revocation: a grant is re-asked this often, so access taken away
  # stops working within a minute rather than when the token expires.
  max_age: 60s
  broker:
    socket: /run/intproxy/broker.sock
    timeout: 5s

integrations:
  - name: github

dial_timeout: 10s
tls_handshake_timeout: 10s

# A header deadline, not a body deadline. There is no read or write timeout at
# all: a packfile clone is one long request in each direction.
response_header_timeout: 60s

idle_timeout: 120s
read_header_timeout: 30s
shutdown_grace: 5m
log_level: info
