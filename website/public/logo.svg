<svg width="128" height="128" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- The dot blinks: it squashes onto the horizontal line through its middle,
       which is what an eyelid closing looks like, and opens again. Declarative
       CSS rather than SMIL or script, because this file is also loaded as an
       image and as a favicon, and only declarative animation runs there.

       `fill-box` makes the origin the dot's own bounding box centre, so it is
       unaffected by the inset transform on the group above it. -->
  <style>
    .lid {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); opacity: 1; }
      95% { transform: scaleY(0.04); opacity: 0; }
    }

    /* Honoured here rather than by the page: an SVG loaded as an image is its
       own document and never sees the host stylesheet. (WCAG 2.3.3) */
    @media (prefers-reduced-motion: reduce) {
      .lid { animation: none; }
    }
  </style>

  <!-- Oxide green plate. Literal, not currentColor: this file is also the
       favicon, where there is no inherited colour to pick up. -->
  <rect width="100" height="100" rx="22" fill="#48D597"/>

  <!-- The mark, inset so the circle does not crowd the rounded corners. -->
  <g transform="translate(50 50) scale(0.86) translate(-50 -50)" stroke="#0B1A1E">
    <!-- Thicker outer circle -->
    <circle cx="50" cy="50" r="44" stroke-width="5"/>

    <!-- The lid line, left behind while the dot is shut -->
    <line x1="28" y1="39" x2="72" y2="39" stroke-width="1.5"/>

    <g class="lid">
      <!-- Squished, filled diamond moved slightly down -->
      <polygon points="50,27 72,39 50,51 28,39" fill="#0B1A1E" stroke="none"/>
      <line x1="50" y1="27" x2="50" y2="51" stroke-width="1.5"/>
    </g>
  </g>
</svg>
