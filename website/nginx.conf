# Serves the prerendered site. Nothing dynamic: links into the console are real
# hyperlinks baked into the HTML, so there are no redirects to own here.

server {
    listen 8080;
    server_name _;

    root /srv;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static and same-origin apart from the Google Fonts stylesheet the design
    # pulls in. `always` so they are set on error responses too.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed by the build, so it can be cached indefinitely. Only
    # `expires` here -- adding an add_header would drop the inherited security
    # headers above for these responses.
    location /_nuxt/ {
        expires 1y;
    }

    # Every page is prerendered to a real file, so this resolves the pretty URL
    # to its document. `=404` rather than a fallback to the 404 document: a miss
    # has to answer 404, not 200 with error content.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # internal: reachable via error_page above, not addressable directly.
    location = /404.html {
        internal;
    }
}
