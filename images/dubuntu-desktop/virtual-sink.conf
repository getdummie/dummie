# The VM has no sound card. gnome-remote-desktop records this sink and sends it
# to the RDP client.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "rdp-sink"
            node.description = "Remote desktop audio"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
        }
    }
]
